name: Docker

# Nightly rebuild that publishes ONLY when something real changed.
#
# The old behavior pushed a fresh :latest digest every night even when caddy,
# every module, and both base images were unchanged -- so Watchtower redeployed
# caddy on every host every day and the upgrade digest reported meaningless
# "upgrades" with no changelog. Now each build computes a fingerprint from what
# was ACTUALLY built -- the binary's own `caddy build-info` dependency list
# (exact module versions xcaddy resolved), the caddy version, both base image
# digests, and the repo commit -- and compares it to the fingerprint label on
# the ghcr :latest image. Unchanged fingerprint -> nothing is pushed at all
# (not even per-arch digests, so no untagged cruft accumulates); changed ->
# per-arch digests push and the merge job assembles + signs :latest. Any real
# upstream change (caddy release, module commit, rebased base image, repo
# edit) still publishes within a day, same as before.
#
# No gha layer cache on purpose: a poisoned cache blob (BlobNotFound on
# import, deduped across scopes) fails buildx outright, and the cache only
# accelerated across-run builds. Within a run the push build reuses the
# builder's local store; the nightly cold compile is the cheap, reliable path.

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the fingerprint is unchanged'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build for THIS arch without pushing, so the fingerprint comes from the
      # binary that will actually ship. The conditional push build below reuses
      # the builder's local layer store, so it costs seconds, not a recompile.
      - name: Build locally for fingerprinting
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/fingerprint:${{ env.PLATFORM_PAIR }}

      - name: Compute build fingerprint
        id: fp
        run: |
          set -euo pipefail
          # `dep` lines carry exact module versions + hashes; arch-independent.
          deps=$(docker run --rm local/fingerprint:${PLATFORM_PAIR} caddy build-info | grep '^dep' | sort)
          version=$(docker run --rm local/fingerprint:${PLATFORM_PAIR} caddy version | awk '{print $1}')
          base_runtime=$(docker buildx imagetools inspect caddy:2 --format '{{.Manifest.Digest}}')
          base_builder=$(docker buildx imagetools inspect caddy:builder --format '{{.Manifest.Digest}}')
          fingerprint=$(printf '%s\n%s\n%s\n%s\n%s\n' \
            "$deps" "$version" "$base_runtime" "$base_builder" "${{ github.sha }}" \
            | sha256sum | cut -d' ' -f1)
          echo "caddy=$version deps=$(echo "$deps" | wc -l) fp=$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare against published fingerprint
        id: gate
        if: github.event_name != 'pull_request'
        run: |
          set -uo pipefail
          # Fingerprint of what's currently on :latest. Any failure to read it
          # (first run, label absent, registry hiccup) leaves it empty -> push.
          current_fp=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:latest" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(.["linux/amd64"] // .) | .config.Labels["net.dpeet.build.fingerprint"] // empty' \
            || echo '')
          force="${{ github.event_name == 'workflow_dispatch' && inputs.force }}"
          if [ "${{ steps.fp.outputs.fingerprint }}" = "$current_fp" ] && [ "$force" != "true" ]; then
            echo "::notice::${PLATFORM_PAIR}: fingerprint unchanged -- skipping digest push"
            push_needed=false
          else
            echo "::notice::${PLATFORM_PAIR}: fingerprint ${current_fp:-<none>} -> ${{ steps.fp.outputs.fingerprint }} (caddy ${{ steps.fp.outputs.version }})"
            push_needed=true
          fi
          echo "push_needed=$push_needed" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/meta
          printf 'fingerprint=%s\nversion=%s\npush_needed=%s\n' \
            "${{ steps.fp.outputs.fingerprint }}" "${{ steps.fp.outputs.version }}" "$push_needed" \
            > "/tmp/meta/${PLATFORM_PAIR}.env"

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request' && steps.gate.outputs.push_needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Custom labels come after the metadata-action set so they win on
          # duplicate keys: version becomes the real caddy version (the
          # watchtower digest reads it to bound release ranges), and the
          # fingerprint rides the image so tomorrow's run can compare.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.fp.outputs.version }}
            net.dpeet.build.fingerprint=${{ steps.fp.outputs.fingerprint }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request' && steps.gate.outputs.push_needed == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && steps.gate.outputs.push_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload fingerprint
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ env.PLATFORM_PAIR }}
          path: /tmp/meta/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download fingerprints
        uses: actions/download-artifact@v4
        with:
          path: /tmp/meta
          pattern: meta-*
          merge-multiple: true

      - name: Reconcile per-arch decisions
        id: gate
        run: |
          set -euo pipefail
          amd_fp=$(grep '^fingerprint=' /tmp/meta/linux-amd64.env | cut -d= -f2)
          arm_fp=$(grep '^fingerprint=' /tmp/meta/linux-arm64.env | cut -d= -f2)
          amd_push=$(grep '^push_needed=' /tmp/meta/linux-amd64.env | cut -d= -f2)
          arm_push=$(grep '^push_needed=' /tmp/meta/linux-arm64.env | cut -d= -f2)
          version=$(grep '^version=' /tmp/meta/linux-amd64.env | cut -d= -f2)
          if [ "$amd_fp" != "$arm_fp" ]; then
            echo "::warning::amd64/arm64 fingerprints differ (upstream moved mid-build)"
          fi
          if [ "$amd_push" = "true" ] && [ "$arm_push" = "true" ]; then
            echo "::notice::Publishing caddy $version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$amd_push" = "false" ] && [ "$arm_push" = "false" ]; then
            echo "::notice::Fingerprint unchanged on both arches -- nothing upstream changed, nothing pushed"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # One arch pushed a digest, the other declined: a mid-build upstream
            # change raced the two gates. Fail loudly; a `force` dispatch
            # publishes a converged pair.
            echo "::error::Per-arch gate decisions disagree (amd64=$amd_push arm64=$arm_push) -- re-run with force=true"
            exit 1
          fi

      - name: Download digests
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.gate.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        if: steps.gate.outputs.publish == 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        if: steps.gate.outputs.publish == 'true'
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Install cosign
        if: steps.gate.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the published Docker image
        if: steps.gate.outputs.publish == 'true'
        run: |
          # Get the digest of the multi-arch manifest using crane
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} --raw | jq -r '.digest // empty')
          # Fallback: extract from inspect output if raw doesn't have digest field
          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} 2>&1 | grep -m1 "Digest:" | awk '{print $2}')
          fi
          echo "Signing manifest digest: ${DIGEST}"
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
